spring.application.name=mysawit-payment
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

xendit.api.key=${XENDIT_API_KEY:TEST_PLACEHOLDER}
xendit.api.url=https://api.xendit.co

# JWT validation
jwt.secret=test-secret-key-that-is-long-enough-for-jwt-validation-in-tests-32bytes

# Comma-separated frontend origins allowed to call this service
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001