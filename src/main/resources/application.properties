spring.application.name=mysawit-payment
server.port=8084
spring.datasource.url=jdbc:postgresql://localhost:5435/mysawit_payment
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
xendit.api.key=${XENDIT_API_KEY:default-test-key-replace-in-production}
xendit.api.url=https://api.xendit.co

# JWT validation
jwt.secret=${JWT_SECRET:dev-local-secret-for-payment-change-me!!}

# Comma-separated frontend origins allowed to call this service
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
