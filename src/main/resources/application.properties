spring.application.name=mysawit-payment
server.port=8084
spring.datasource.url=jdbc:postgresql://localhost:5435/mysawit_payment
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
xendit.api.key=${XENDIT_API_KEY:default-test-key-replace-in-production}
xendit.api.url=https://api.xendit.co

# JWT validation
jwt.secret=${JWT_SECRET:dev-secret-key-dev-secret-key-123456}

